<script src="assets/js/api.js" defer></script>

<script>
let cartStoreSettings = { shippingCharge: 99, freeShippingThreshold: 999 };

document.addEventListener('DOMContentLoaded', async () => {
  setActiveNavLink();
  updateNavbarAuth();
  updateCartBadge();
  initMobileMenu();

  try {
    const res = await api.get('/settings');
    if (res.settings) {
      cartStoreSettings = {
        shippingCharge:        Number(res.settings.shippingCharge ?? 99),
        freeShippingThreshold: Number(res.settings.freeShippingThreshold ?? 999)
      };
    }
  } catch {}

  renderCartPage();
  hidePageLoader();
});

function renderCartPage() {
  const cart      = getCart();
  const items     = document.getElementById('cart-items');
  const summary   = document.getElementById('cart-summary');
  const cartMain  = document.getElementById('cart-main');

  if (!cart.length) {
    cartMain.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:80px 20px;">
        <p style="font-size:64px;margin-bottom:16px;">🛒</p>
        <h2 style="font-family:var(--font-serif);font-size:28px;margin-bottom:12px;">Your Cart is Empty</h2>
        <p style="color:var(--text-secondary);margin-bottom:28px;">Add some beautiful fragrances to your cart.</p>
        <a href="shop.html" class="btn btn-gold btn-lg">Browse Collection</a>
      </div>`;
    return;
  }

  const subtotal  = getCartTotal();
  const threshold = cartStoreSettings.freeShippingThreshold;
  const stdFee    = cartStoreSettings.shippingCharge;
  const shipping  = (threshold > 0 && subtotal >= threshold) || stdFee === 0 ? 0 : stdFee;
  const total     = subtotal + shipping;

  items.innerHTML = cart.map((item, idx) => {
    const itemImg = window.getProductPrimaryImage ? window.getProductPrimaryImage(item.productId || item._id, item.size) : 'products/ruxova-50ml-1.jpg';
    return `
      <div class="card cart-item-card" id="cart-item-${idx}">
        <img src="${itemImg}" alt="${item.name}" class="cart-item-img">
        <div class="cart-item-details">
          <h3 class="cart-item-title">${item.productName || item.name} <span style="font-size:13px;color:var(--gold);">(${item.size || '50ml'})</span></h3>
          <p class="cart-item-price">${formatCurrency(item.price)}</p>
          <div class="cart-item-controls">
            <div class="cart-qty-picker">
              <button onclick="changeQty(${idx}, ${item.quantity - 1})" class="cart-qty-btn" aria-label="Decrease quantity">−</button>
              <span class="cart-qty-val">${item.quantity}</span>
              <button onclick="changeQty(${idx}, ${item.quantity + 1})" class="cart-qty-btn" aria-label="Increase quantity">+</button>
            </div>
            <button onclick="removeItem(${idx})" class="cart-remove-btn">🗑 Remove</button>
          </div>
        </div>
        <div class="cart-item-subtotal">
          <p style="font-size:17px;font-weight:700;color:var(--gold);">${formatCurrency(item.price * item.quantity)}</p>
        </div>
      </div>
    `;
  }).join('');

  summary.innerHTML = `
    <div class="card" style="padding:28px;">
      <h2 style="font-family:var(--font-serif);font-size:20px;font-weight:700;margin-bottom:24px;">Order Summary</h2>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-secondary);">Subtotal (${getCartCount()} items)</span><span>${formatCurrency(subtotal)}</span></div>
        <div style="display:flex;justify-content:space-between;">
          <span style="color:var(--text-secondary);">Shipping</span>
          <span>${shipping === 0 ? '<span style="color:var(--success);">FREE</span>' : formatCurrency(shipping)}</span>
        </div>
        ${shipping > 0 && threshold > 0 ? `<p style="font-size:12px;color:var(--text-muted);">Add ${formatCurrency(threshold - subtotal)} more for free shipping!</p>` : ''}
      </div>
      <div class="gold-divider" style="margin:0 0 20px;"></div>
      <div style="display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-bottom:24px;">
        <span>Total</span><span style="color:var(--gold);">${formatCurrency(total)}</span>
      </div>
      <a href="checkout.html" class="btn btn-gold btn-lg" style="width:100%;text-align:center;">Proceed to Checkout →</a>
      <a href="shop.html" class="btn btn-dark" style="width:100%;text-align:center;margin-top:12px;">Continue Shopping</a>
    </div>`;
}

function changeQty(id, qty) {
  updateCartQuantity(id, qty);
  renderCartPage();
}

function removeItem(id) {
  removeFromCart(id);
  renderCartPage();
}
</script>
</body>
