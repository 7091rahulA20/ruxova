<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Perfume Details — RUXOVA PERFUMES</title>
  <meta name="description" content="View luxury perfume details, scent notes, ingredients, image gallery, customer reviews, and pricing at RUXOVA PERFUMES.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    @media(max-width:768px) {
      .product-layout { grid-template-columns: 1fr !important; gap: 32px !important; }
    }
    /* Lightbox Modal */
    .lightbox-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      z-index: 999; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; user-select: none;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-img-wrapper {
      position: relative; max-width: 90vw; max-height: 80vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center; border-radius: 12px;
    }
    .lightbox-img {
      max-width: 100%; max-height: 80vh; object-fit: contain;
      transition: transform 0.25s ease, opacity 0.2s ease; cursor: grab;
    }
    .lightbox-btn {
      background: rgba(22, 22, 22, 0.8); border: 1px solid var(--gold); color: var(--gold);
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 20px; cursor: pointer; transition: all 0.2s;
    }
    .lightbox-btn:hover { background: var(--gold); color: #000; }
  </style>
</head>
<body>
<div class="page-loader" id="page-loader">
  <p class="loader-logo gold-text">RUXOVA</p>
  <div class="loader-ring"></div>
</div>

<nav class="navbar">
  <a href="index.html" class="navbar-logo gold-text">RUXOVA</a>
  <ul class="navbar-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li id="nav-auth-links" style="display:contents;"></li>
  </ul>
  <div class="navbar-actions">
    <a href="cart.html" class="cart-icon"><span>🛒</span><span class="cart-badge cart-count" style="display:none;">0</span></a>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="index.html">Home</a><a href="shop.html">Shop</a>
  <a href="cart.html">Cart</a><a href="orders.html">My Orders</a>
  <a href="login.html" class="btn btn-gold" style="margin-top:16px;text-align:center;">Login</a>
</div>

<!-- Breadcrumb -->
<div style="padding:16px 24px;max-width:1200px;margin:0 auto;">
  <p style="font-size:13px;color:var(--text-muted);">
    <a href="index.html" style="color:var(--text-muted);text-decoration:none;">Home</a>
    <span style="margin:0 8px;">›</span>
    <a href="shop.html" style="color:var(--text-muted);text-decoration:none;">Shop</a>
    <span style="margin:0 8px;">›</span>
    <span style="color:var(--gold);" id="breadcrumb-title">Product Details</span>
  </p>
</div>

<!-- Product Content -->
<main id="product-container" style="max-width:1200px;margin:0 auto;padding:24px;"></main>

<!-- Lightbox Zoom Overlay -->
<div id="lightbox" class="lightbox-overlay">
  <div style="position:absolute;top:20px;right:20px;display:flex;gap:12px;z-index:1001;">
    <button type="button" class="lightbox-btn" id="lb-zoom-in" title="Zoom In">+</button>
    <button type="button" class="lightbox-btn" id="lb-zoom-out" title="Zoom Out">−</button>
    <button type="button" class="lightbox-btn" id="lb-reset-zoom" title="Reset Zoom" style="font-size:14px;">100%</button>
    <button type="button" class="lightbox-btn" id="lb-close" title="Close (ESC)">✕</button>
  </div>

  <button type="button" class="lightbox-btn" id="lb-prev" style="position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:1001;">‹</button>
  
  <div class="lightbox-img-wrapper">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Zoomed Product Image">
  </div>
  
  <button type="button" class="lightbox-btn" id="lb-next" style="position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:1001;">›</button>

  <p id="lightbox-counter" style="color:var(--gold);font-size:14px;margin-top:16px;z-index:1001;"></p>
</div>

<!-- Footer -->
<footer style="background:var(--black-soft);border-top:1px solid var(--black-border);padding:32px 24px;text-align:center;margin-top:80px;">
  <p class="gold-text" style="font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:3px;margin-bottom:8px;">RUXOVA</p>
  <div class="social-links-wrap" style="justify-content:center;margin:12px 0 16px;">
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon-link">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="social-icon-link">
      <i class="fa-brands fa-facebook-f"></i>
    </a>
    <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" class="social-icon-link">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
  </div>
  <p style="color:var(--text-muted);font-size:13px;">© 2025 RUXOVA PERFUMES. All rights reserved. Developed by RSAGENCY</p>
</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/cart.js"></script>

<script src="assets/js/product.js"></script>
</body>
</html>
